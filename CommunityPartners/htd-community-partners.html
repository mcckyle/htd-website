<script>
//Animate fade-in for a polished look.
document.addEventListener("DOMContentLoaded", () =>
{
  const partners = document.querySelectorAll(".partner");

  if (!partners.length)
  {
    return;
  }

  const revealPartner = (partner) =>
  {
    partner.classList.add("partner-visible");
  };

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if ((reducedMotion) || !("IntersectionObserver" in window))
  {
    partners.forEach(revealPartner);
    return;
  }

  const observer = new IntersectionObserver((entries) =>
  {
      entries.forEach((entry) =>
      {
        if (!entry.isIntersecting)
        {
          return
        }

        revealPartner(entry.target);
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px" });

  partners.forEach((partner, index) =>
  {
    partner.style.transitionDelay = `${Math.min(index * 18, 180)}ms`;
    observer.observe(partner);
  });
});
</script>
