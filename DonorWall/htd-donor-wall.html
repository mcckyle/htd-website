<style>
/* ===============================================
   HIGHWAY TO DESTINY - DONOR WALL STYLES.
   Designed specifically to sit on top of the existing
   solid brand green (#47ad32) outer page background color.
================================================== */
.donor-wall
{
  --brand: #47ad32;
  --brand-deep: #318c25;

  --paper: #fbfaf7;
  --paper-bright: #ffffff;
  --paper-soft: #f3f4ef;

  --ink: #17351b;
  --ink-soft: #5a6d5c;
  --white: #ffffff;

  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: clamp(5.5rem, 10vw, 8.5rem) clamp(1rem, 4vw, 2rem) clamp(6rem, 10vw, 9rem);

  /* IMPORTANT:
     The outer page is already #47ad32.
     This creates a premium layered panel effect instead
     of stacking more aggressive greens. */
  background: linear-gradient(180deg, #47ad32 0%, #46aa31 48%, #47ad32 100%);
}
.donor-wall::before
{
  /* Donor Wall Ambient Light Styles. */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% -15%, rgba(255, 255, 255, 0.18), transparent 38%);
}
.donor-wall-glow
{
  position: absolute;
  width: min(55vw, 760px);
  aspect-ratio: 1;
  top: -42%;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.055) 38%, transparent 70%);
}
.donor-wall-container
{
  position: relative;
  width: min(100%, 1240px);
  margin-inline: auto;
}
.donor-wall-header
{
  width: min(100%, 720px);
  margin-inline: auto;
  text-align: center;
}
.donor-wall-eyebrow
{
  display: inline-flex;
  align-items: center;
  gap: 0.70rem;

  margin-bottom: 1.35rem;
  color: rgba(255, 255, 255, 0.82);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  line-height: 1;
  text-transform: uppercase;
}
.donor-wall-eyebrow::before,
.donor-wall-eyebrow::after
{
  content: "";
  width: 1.7rem;
  height: 1px;
  background: rgba(255, 255, 255, 0.42);
}
.donor-wall-title
{
  margin: 0;
  color: var(--white);

  font-size: clamp(3.4rem, 8vw, 6.2rem);
  font-weight: 800;
  line-height: 0.90;
  letter-spacing: -0.065em;
  text-wrap: balance;
}
.donor-wall-subtitle
{
  width: min(100%, 640px);
  margin: 1.75rem auto 0;

  color: rgba(255, 255, 255, 0.78);

  font-size: clamp(1rem, 1.4vw, 1.08rem);
  line-height: 1.8;
  text-wrap: balance;
}
.donor-wall-summary
{
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 0.60rem;

  margin-top: clamp(3.25rem, 5vw, 4.75rem);
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.68rem;
  font-weight: 750;
  letter-spacing: 0.16em;
  line-height: 1;
  text-transform: uppercase;
}
.donor-wall-count
{
  color: var(--white);
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: -0.03em;
}
.donor-wall-summary-label { opacity: 0.86; }
.donor-wall-divider
{
  width: min(100%, 900px);
  height: 1px;
  margin: 2rem auto 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34) 20%, rgba(255, 255, 255, 0.34) 80%, transparent);
}
.donor-grid
{
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
  margin-top: clamp(2.5rem, 5vw, 4rem);
  padding: 0.80rem;

  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 1.5rem;
  background: rgba(255, 255, 255, 0.085);
  box-shadow: 0 24px 70px rgba(17, 58, 18, 0.12);

  animation: donor-grid-enter 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
}
.donor-card
{
  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 118px;
  padding: 1.25rem 1rem;

  border: 1px solid rgba(23, 53, 27, 0.055);
  border-radius: 0.85rem;
  background: var(--paper);
  color: var(--ink);

  font-size: 0.96rem;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 1.4;
  text-align: center;

  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.90) inset, 0 5px 18px rgba(23, 53, 27, 0.045);

  opacity: 0;
  transform: translateY(10px);
  contain: layout paint;

  transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;

  animation: donor-card-enter 560ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: calc(var(--i) * 28ms);
}
.donor-card:hover { transform: translateY(-2px); border-color: rgba(23, 53, 27, 0.09); background: var(--paper-bright); box-shadow: 0 12px 30px rgba(23, 53, 27, 0.075); }
.donor-card:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.65); outline-offset: 4px; }

@keyframes donor-grid-enter
{
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes donor-card-enter
{
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce)
{
  .donor-grid, .donor-card { opacity: 1; transform: none; animation: none; }
  .donor-card, .donor-card:hover { transform: none; transition: none; }
}

@media (max-width: 1050px)
{
  .donor-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 720px)
{
  .donor-wall { padding-block: 4.75rem 5.5rem; }
  .donor-wall-title { font-size: clamp(3rem, 15vw, 4.5rem); }
  .donor-wall-subtitle { font-size: 0.96rem; line-height: 1.72; }
  .donor-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; padding: 0.55rem; border-radius: 1.2rem; }
  .donor-card { min-height: 92px; padding: 1rem 0.70rem; font-size: 0.88rem; }
}
@media (max-width: 460px)
{
  .donor-wall-eyebrow::before, .donor-wall-eyebrow::after { width: 1.1rem; }
  .donor-wall-summary { gap: 0.45rem; font-size: 0.62rem; }
  .donor-grid { grid-template-columns: 1fr; border-radius: 1rem; }
  .donor-card { min-height: 70px; }
}
</style>
