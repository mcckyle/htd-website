<style>
/* ===============================================
   HIGHWAY TO DESTINY - DONOR WALL STYLES.
   Designed specifically to sit on top of the existing
   solid brand green (#47ad32) outer page background color.
================================================== */
.donor-wall
{
  --brand: #47ad32;
  --brand-deep: #2f7f25;
  --brand-dark: #173b18;

  --surface: #fbfaf6;
  --surface-soft: #f3f5ef;

  --text: #18301a;
  --text-soft: #58705a;

  --line: rgba(23, 59, 24, 0.11);
  --line-strong: rgba(23, 59, 24, 0.18);

  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: clamp(5.5rem, 9vw, 8.5rem) clamp(1rem, 4vw, 2rem);

  /* IMPORTANT:
     The outer page is already #47ad32.
     This creates a premium layered panel effect instead
     of stacking more aggressive greens. */
  background: inear-gradient(180deg, #47ad32 0%, #43a82f 18%, #47ad32 100%);
}

/* Donor Wall Ambient Background Styles. */
.donor-wall-ambient
{
  position: absolute;
  z-index: -1;

  width: min(70vw, 760px);
  aspect-ratio: 1;

  top: -42%;
  left: 50%;
  transform: translateX(-50%);

  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.16) 0%,
    rgba(255, 255, 255, 0.07) 32%,
    transparent 68%
  );
}
.donor-wall::after
{
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  background-image: radial-gradient(rgba(255, 255, 255, 0.9) 0.5px, transparent 0.5px);
  background-size: 7px 7px;
}
.donor-wall-container
{
  width: min(100%, 1280px);
  margin-inline: auto;
}
.donor-wall-header
{
  width: min(100%, 760px);
  margin-inline: auto;
  text-align: center;
}
.donor-wall-eyebrow
{
  display: inline-flex;
  align-items: center;
  gap: 0.70rem;

  margin-bottom: 1.35rem;
  color: rgba(255, 255, 255, 0.82);
  font-size: 0.70rem;
  font-weight: 750;
  letter-spacing: 0.20em;
  line-height: 1;
  text-transform: uppercase;
}
.donor-wall-eyebrow::before,
.donor-wall-eyebrow::after
{
  content: "";
  width: 1.8rem;
  height: 1px;
  background: rgba(255, 255, 255, 0.42);
}
.donor-wall-title
{
  margin: 0;
  color: #ffffff;

  font-size: clamp(3.25rem, 8vw, 6.25rem);
  font-weight: 800;
  line-height: 0.90;
  letter-spacing: -0.065em;
  text-wrap: balance;
}
.donor-wall-subtitle
{
  width: min(100%, 650px);
  margin: 1.7rem auto 0;

  color: rgba(255, 255, 255, 0.76);

  font-size: clamp(1rem, 1.5vw, 1.08rem);
  line-height: 1.8;
  text-wrap: balance;
}
.donor-wall-meta
{
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 0.60rem;

  margin-top: clamp(3rem, 5vw, 4.5rem);
  color: rgba(255, 255, 255, 0.68);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.donor-wall-count
{
  color: #ffffff;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.donor-wall-count-label { opacity: 0.82; }
.donor-wall-rule
{
  width: min(100%, 920px);
  height: 1px;
  margin: 2rem auto;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34) 20%, rgba(255, 255, 255, 0.34) 80%, transparent);
}
.donor-grid
{
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
  margin-top: clamp(2.5rem, 5vw, 4.5rem);
  padding: clamp(0.75rem, 1.5vw, 1rem);

  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 1.5rem;
  background: rgba(255, 255, 255, 0.075);
  box-shadow: 0 1.5rem 4rem rgba(20, 70, 20, 0.12);

  animation: donorGridReveal 0.70s ease both;
}
.donor-card
{
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 104px;
  padding: 1.25rem;

  border: 1px solid transparent;
  border-radius: 0.95rem;
  background: var(--surface);
  color: var(--text);

  font-size: 0.98rem;
  font-weight: 650;
  letter-spacing: -0.012em;
  line-height: 1.45;
  text-align: center;

  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.80) inset, 0 5px 18px rgba(22, 66, 22, 0.045);

  opacity: 0;
  transform: translateY(10px);

  transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;

  animation: donorEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: calc(var(--i) * 24ms);
}
.donor-card::before
{
  /* Subtle Top Highlight Styles. */
  content: "";
  position: absolute;
  top: 0.80rem;
  left: 50%;
  width: 1.5rem;
  height: 2px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: var(--brand);
  opacity: 0.50;

  transition: width 180ms ease, opacity 180ms ease;
}
.donor-card:hover { transform: translateY(-3px); border-color: var(--line); background: #ffffff; box-shadow: 0 12px 28px rgba(22, 66, 22, 0.09); }
.donor-card:hover::before { width: 2.5rem; opacity: 0.90; }

@keyframes donorEnter
{
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@keyframes donorGridReveal
{
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce)
{
  .donor-grid, .donor-card { opacity: 1; transform: none; animation: none; }
  .donor-card, .donor-card:hover { transform: none; transition: none; }
}

@media (max-width: 1050px)
{
  .donor-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 720px)
{
  .donor-wall { padding-block: 4.5rem 5.5rem; }
  .donor-wall-title { font-size: clamp(3rem, 15vw, 4.5rem); }
  .donor-wall-subtitle { font-size: 0.98rem; line-height: 1.7; }
  .donor-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.60rem; padding: 0.60rem; border-radius: 1.2rem; }
  .donor-card { min-height: 92px; padding: 1rem 0.75rem; font-size: 0.90rem; }
}
@media (max-width: 460px)
{
  .donor-wall-eyebrow::before, .donor-wall-eyebrow::after, { width: 1.1rem; }
  .donor-grid { grid-template-columns: 1fr;  }
  .donor-card { min-height: 72px; }
}
