#File name: lighthouse-audit.yml
#Author: Kyle McColgan
#Date: 12 October 2026
#Description: This file contains the workflow for GitHub Actions to run accessibility checks.

name: Performance and SEO Audit

on:
  push:
    branches:
      - main
  #Dependabot merges can explicitly trigger the workflow.
  workflow_dispatch:

permissions:
  contents: read #Lighthouse only needs read acess to files.

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Static Server via NPX
        run: npx http-server . -p 8080 &

      - name: Wait for Server
        # Gives the background server 3 seconds to fully initialize.
        run: sleep 3

      - name: Audit HTML files with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
          temporaryPublicStorage: true
