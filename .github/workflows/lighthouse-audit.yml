#File name: lighthouse-audit.yml
#Author: Kyle McColgan
#Date: 12 October 2026
#Description: This file contains the workflow for GitHub Actions to run accessibility checks.

name: Performance and SEO Audit

on:
  push:
    branches:
      - main
  #Dependabot merges can explicitly trigger the workflow.
  workflow_dispatch:

permissions:
  contents: read #Lighthouse only needs read acess to files.

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Static Server via NPX
        #Spins up the server at the root directory.
        run: npx http-server . -p 8080 --cors &

      - name: Wait for Server
        # Gives the background server 5 seconds to fully initialize.
        run: sleep 5

      - name: Dynamically Discover HTML Files & Run Audit
        run: |
          # 1. Find all .html files, excluding hidden files or node_modules.
          HTML_FILES=$(find . -name "*.html" ! -path "*/.*" | sed 's|^\./||')

          # 2. Convert the list of files into a comma-separated list of localhost URLs.
          URLS=""
          for file in $HTML_FILES; do
            URLS="${URLS}http://localhost:8080/${file},"
          done

          # 3. Strip the trailing comma.
          URLS_CLEAN=$(echo "$URLS" | sed 's/,$//')

          echo "Discovered section files to audit: $URLS_CLEAN"

          # 4. Invoke the Lighthouse CLI directly using the discovered URLs.
          npx @lhci/cli@0.12.x collect \
            --url="$URLS_CLEAN" \
            --settings.chromeFlags="--no-sandbox --headless --disable-gpu"
